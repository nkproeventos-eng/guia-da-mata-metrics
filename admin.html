<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Métricas - Guia da Mata</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e0e0e0; }
        .header h1 { font-size: 24px; color: #1e4d3b; }
        .btn-refresh { background-color: #1e4d3b; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-refresh:hover { background-color: #143528; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h3 { font-size: 13px; text-transform: uppercase; color: #64748b; margin-bottom: 10px; letter-spacing: 0.5px; }
        .card .value { font-size: 32px; font-weight: bold; color: #1e4d3b; }
        .table-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .table-container h2 { font-size: 18px; color: #1e4d3b; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #edf2f7; }
        th { background-color: #1e4d3b; color: white; font-weight: 600; }
        tr:hover { background-color: #f8fafc; }
        .badge { background-color: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Painel de Métricas - Guia da Mata</h1>
        <button class="btn-refresh" onclick="loadMetrics()">🔄 Atualizar Dados</button>
    </div>

    <div class="cards-grid">
        <div class="card">
            <h3>Cliques no WhatsApp</h3>
            <div class="value" id="whatsapp-clicks">0</div>
        </div>
        <div class="card">
            <h3>Sessões / Acessos</h3>
            <div class="value" id="total-sessions">0</div>
        </div>
        <div class="card">
            <h3>Usuários Únicos</h3>
            <div class="value" id="unique-users">0</div>
        </div>
    </div>

    <div class="table-container">
        <h2>Ranking de Engajamento por Comércio</h2>
        <table>
            <thead>
                <tr>
                    <th>ID do Comércio</th>
                    <th>Nome do Estabelecimento</th>
                    <th>Total de Cliques no WhatsApp</th>
                </tr>
            </thead>
            <tbody id="commerce-table-body">
                <tr><td colspan="3">Carregando métricas...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadMetrics() {
            try {
                const response = await fetch('/api/metrics/summary');
                const data = await response.json();

                document.getElementById('whatsapp-clicks').innerText = data.total_whatsapp_clicks || 0;
                document.getElementById('total-sessions').innerText = data.total_sessions || 0;
                document.getElementById('unique-users').innerText = data.unique_users || 0;

                const tbody = document.getElementById('commerce-table-body');
                tbody.innerHTML = '';

                if (data.clicks_by_commerce && data.clicks_by_commerce.length > 0) {
                    data.clicks_by_commerce.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${item.comercio_id}</strong></td>
                            <td>${item.comercio_nome}</td>
                            <td><span class="badge">${item.clicks} clique(s)</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3">Nenhum clique registrado ainda.</td></tr>';
                }
            } catch (error) {
                console.error('Erro ao carregar métricas:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadMetrics);
    </script>
</body>
</html>
